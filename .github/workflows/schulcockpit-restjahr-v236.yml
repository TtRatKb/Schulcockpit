name: Schulcockpit Jahresplanung Regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check schulcockpit-restjahr-v236.js
          node --check schulcockpit-materialhub-v237.js
          node --check schulcockpit-materialarchive-v238.js
          node --check schulcockpit-curriculum-v206.js
          node --check schulcockpit-curriculum-audit-v207.js
      - name: Synthetic regression tests
        run: node --test tests/*.test.cjs
