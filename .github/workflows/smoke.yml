name: Schulcockpit smoke
on:
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - 'index.html'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check tests/browser-smoke.mjs
      - name: Canonical dated syllabus, classwork, fieldtrip and substitution assignment
        run: node tests/lesson-context-v289.test.js
      - name: Auto-fill missing future timetable cards without changing existing preparations
        run: node tests/weekfill-v288.test.js
      - name: Verify fresh-versus-populated Firefox target protection
        run: node tests/firefox-target-v286.test.js
      - name: Finder dropzone and backup format regression
        run: node tests/dropzone-v284.test.js
      - name: Verify timetable insertion and preservation of prepared lessons
        run: node tests/flexplan-v278.test.js
      - name: Pre-correction and safe separate Classtime makeup sessions
        run: |
          node tests/nachschreiben-v300.test.js
          node tests/nachschreiben-ui-v300.test.js
      - name: Print ZIP identity, teaching method bank and visual import hints
        run: |
          node tests/print-audit-v297.test.js
          node tests/methoden-v298.test.js
          node tests/unterricht-qualitaet-v299.test.js
      - name: Saved lesson reflection and differentiated own-material editions
        run: |
          node tests/lesson-memory-v295.test.js
          node tests/material-evolution-v296.test.js
          node tests/material-evolution-ui-v296.test.js
      - name: Material Hub role/duplicate triage and links to existing exam evaluation
        run: |
          node tests/material-triage-v294.test.js
          node tests/workflow-links-v294.test.js
      - name: Subject-specific feedback language for Religion and Mathematik
        run: node tests/feedback-fach-v293.test.js
      - name: LE score completion, feedback UI and safe points-only PDF exports
        run: |
          node tests/le-score-v283.test.js
          node tests/le-print-v291.test.js
          node tests/le-competence-v292.test.js
      - name: Verify earned bonus versus credited points, incl. competency-only bonus
        run: node tests/bonus-earned-v282.test.js
      - name: Individual bonus matrix and competence recalculation regression
        run: node tests/bonusmatrix-v281.test.js
      - name: Bonus-only competency validation and reporting regression
        run: node tests/bonus-subskills-v279.test.js
      - name: Run isolated Chrome smoke test
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sc-smoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tests/browser-smoke.mjs
