name: Schulcockpit smoke
on:
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - 'index.html'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check tests/browser-smoke.mjs
      - name: Verify timetable insertion and preservation of prepared lessons
        run: node tests/flexplan-v278.test.js
      - name: Verify earned bonus versus credited points, incl. competency-only bonus
        run: node tests/bonus-earned-v282.test.js
      - name: Individual bonus matrix and competence recalculation regression
        run: node tests/bonusmatrix-v281.test.js
      - name: Bonus-only competency validation and reporting regression
        run: node tests/bonus-subskills-v279.test.js
      - name: Run isolated Chrome smoke test
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sc-smoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node tests/browser-smoke.mjs
